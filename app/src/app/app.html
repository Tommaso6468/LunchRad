<main class="shell">
  <h1 class="title">{{ t.appName }}</h1>
  <p class="tagline">{{ t.tagline }}</p>
  <p class="note">{{ t.comingSoon }}</p>

  <figure class="example">
    <figcaption>{{ t.exampleCodeLabel }}</figcaption>
    <p class="room-code" aria-label="K 7 Q 4 M 0">
      @for (c of exampleCode; track $index) {
        <span [class]="c.kind">{{ c.char }}</span>
      }
    </p>
  </figure>
</main>
<router-outlet />

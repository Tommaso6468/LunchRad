version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    ignore:
      # Angular dictates the supported TypeScript range (22.x: >=6.0 <6.1).
      # TypeScript majors are upgraded together with an Angular major.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Amsterdam
    groups:
      actions:
        patterns: ['*']

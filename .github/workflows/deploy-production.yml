name: Deploy production

# Publishing a GitHub release (tag vX.Y.Z on main) deploys to production.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.release.tag_name }} to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The "production" environment should require your approval (see docs/setup.md).
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Release must be a semver tag on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"; exit 1
          fi
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::Tag '$TAG' does not point to a commit on main"; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Full verification again: never ship a build that was not tested as-is.
      - run: npm run verify
      - run: npm audit --audit-level=high

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          TAG: ${{ github.event.release.tag_name }}
        run: npx wrangler deploy --env production --message "Release $TAG"
      - name: Smoke test
        if: vars.PRODUCTION_URL != ''
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: ./scripts/smoke-test.sh "$BASE_URL"

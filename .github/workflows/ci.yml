name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repo unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:forbidden
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate Worker config (no deploy)
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --env production --outdir ../dist/worker-dry-run

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities (high and critical fail the build)
        run: npm audit --audit-level=high
      - name: Registry signatures and provenance
        run: |
          if ! out=$(npm audit signatures 2>&1); then
            # Surface the reason as annotations, visible on the PR.
            echo "$out" | tail -20 | sed 's/^/::error::/'
            exit 1
          fi
          echo "$out"

  # Blocks a PR that adds or upgrades to a vulnerable dependency.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Fails on any known vulnerability in the whole lockfile (not only the PR's
  # changes), using the OSV database. Broader than npm audit, which only fails
  # on high, and it also runs on pushes to main.
  osv:
    name: Vulnerability scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official binary, pinned by version and SHA-256. Runs without a
      # third-party action, so nothing extra has to be allow-listed.
      - name: Install OSV-Scanner v2.7.1
        env:
          OSV_VERSION: v2.7.1
          OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # Non-zero exit on any vulnerability, and also on scanner or network
      # errors, so the check fails closed.
      - name: Scan lockfile
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile=package-lock.json'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks lists the PR's commits.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments need write access; findings show in the job log and summary.
          GITLEAKS_ENABLE_COMMENTS: 'false'
